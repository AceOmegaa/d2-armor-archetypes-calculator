<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calculateur d'Archétypes - Destiny 2</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0e1117; color: #c9d1d9; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    h2 { color: #58a6ff; margin: 0; }
    h3 { color: #79c0ff; margin-top: 0; margin-bottom: 15px; font-size: 1.1em; }
    .lang-select { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    /* Layout des 3 colonnes alignées */
    .grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; margin-top: 15px; align-items: stretch; }
    .grid-col { background: #161b22; display: flex; flex-direction: column; }
    
    /* Alignement parfait des lignes */
    .stat-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 8px; 
      background: #21262d; 
      padding: 4px 10px; 
      border-radius: 4px; 
      height: 40px; /* Fixe la hauteur de chaque ligne */
    }
    .stat-row label { font-size: 0.9em; }

    /* Normalisation des contrôles (input et select de même hauteur) */
    input[type="number"], select.prio-select { 
      height: 28px; 
      line-height: 28px;
      padding: 0 6px; 
      background: #0d1117; 
      border: 1px solid #30363d; 
      border-radius: 4px; 
      font-size: 0.85em;
    }

    input[type="number"] { width: 60px; color: #58a6ff; text-align: center; font-weight: bold; }
    select.prio-select { color: #e3b341; width: 175px; }

    button { width: 100%; padding: 14px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.05em; margin-top: 15px; transition: background 0.2s; }
    button:hover { background: #2ea043; }
    .results { margin-top: 25px; background: #0d1117; padding: 20px; border-radius: 6px; border: 1px solid #30363d; }
    .piece-card { background: #161b22; border-left: 4px solid #58a6ff; margin-bottom: 10px; padding: 12px 15px; border-radius: 0 4px 4px 0; }
    .piece-title { font-weight: bold; color: #f0f6fc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.85em; font-weight: bold; margin-left: 5px; }
    .badge-artifice { background: #388bfd33; color: #58a6ff; border: 1px solid #388bfd66; }
    .badge-mod { background: #23863633; color: #3fb950; border: 1px solid #23863666; }
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .summary-table th, .summary-table td { border: 1px solid #30363d; padding: 8px; text-align: center; }
    .summary-table th { background: #21262d; color: #8b949e; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 id="ui-title">Calculateur d'Archétypes - Destiny 2</h2>
    <select id="langSelect" class="lang-select" onchange="toggleLanguage()">
      <option value="fr" selected>🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
    </select>
  </div>

  <div class="grid">
    <!-- Objectifs -->
    <div class="grid-col">
      <h3 id="ui-section1">1. Paliers Visés</h3>
      <div class="stat-row"><label id="lbl-target-Sante">Santé :</label><input type="number" id="target-Sante" value="0" step="5"></div>
      <div class="stat-row"><label id="lbl-target-Grenade">Grenade :</label><input type="number" id="target-Grenade" value="200" step="5"></div>
      <div class="stat-row"><label id="lbl-target-Melee">Mêlée :</label><input type="number" id="target-Melee" value="100" step="5"></div>
      <div class="stat-row"><label id="lbl-target-Super">Super :</label><input type="number" id="target-Super" value="0" step="5"></div>
      <div class="stat-row"><label id="lbl-target-Classe">Classe :</label><input type="number" id="target-Classe" value="100" step="5"></div>
      <div class="stat-row"><label id="lbl-target-Armes">Armes :</label><input type="number" id="target-Armes" value="0" step="5"></div>
    </div>

    <!-- Doctrine -->
    <div class="grid-col">
      <h3 id="ui-section2">2. Modificateurs Doctrine</h3>
      <div class="stat-row"><label id="lbl-doc-Sante">Santé :</label><input type="number" id="doc-Sante" value="0" step="5"></div>
      <div class="stat-row"><label id="lbl-doc-Grenade">Grenade :</label><input type="number" id="doc-Grenade" value="-20" step="5"></div>
      <div class="stat-row"><label id="lbl-doc-Melee">Mêlée :</label><input type="number" id="doc-Melee" value="0" step="5"></div>
      <div class="stat-row"><label id="lbl-doc-Super">Super :</label><input type="number" id="doc-Super" value="10" step="5"></div>
      <div class="stat-row"><label id="lbl-doc-Classe">Classe :</label><input type="number" id="doc-Classe" value="0" step="5"></div>
      <div class="stat-row"><label id="lbl-doc-Armes">Armes :</label><input type="number" id="doc-Armes" value="0" step="5"></div>
    </div>

    <!-- Sacrifiabilité pour Artifice -->
    <div class="grid-col">
      <h3 id="ui-section3">3. Sacrifiabilité (Artifice)</h3>
      <div class="stat-row">
        <label id="lbl-prio-Sante">Santé :</label>
        <select id="prio-Sante" class="prio-select">
          <option value="1" class="opt-prio1">Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2" selected>Moyenne</option>
          <option value="3" class="opt-prio3">Basse (Protéger)</option>
        </select>
      </div>
      <div class="stat-row">
        <label id="lbl-prio-Grenade">Grenade :</label>
        <select id="prio-Grenade" class="prio-select">
          <option value="1" class="opt-prio1">Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2">Moyenne</option>
          <option value="3" class="opt-prio3" selected>Basse (Protéger)</option>
        </select>
      </div>
      <div class="stat-row">
        <label id="lbl-prio-Melee">Mêlée :</label>
        <select id="prio-Melee" class="prio-select">
          <option value="1" class="opt-prio1">Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2" selected>Moyenne</option>
          <option value="3" class="opt-prio3">Basse (Protéger)</option>
        </select>
      </div>
      <div class="stat-row">
        <label id="lbl-prio-Super">Super :</label>
        <select id="prio-Super" class="prio-select">
          <option value="1" class="opt-prio1" selected>Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2">Moyenne</option>
          <option value="3" class="opt-prio3">Basse (Protéger)</option>
        </select>
      </div>
      <div class="stat-row">
        <label id="lbl-prio-Classe">Classe :</label>
        <select id="prio-Classe" class="prio-select">
          <option value="1" class="opt-prio1">Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2" selected>Moyenne</option>
          <option value="3" class="opt-prio3">Basse (Protéger)</option>
        </select>
      </div>
      <div class="stat-row">
        <label id="lbl-prio-Armes">Armes :</label>
        <select id="prio-Armes" class="prio-select">
          <option value="1" class="opt-prio1" selected>Haute (Sacrifier d'abord)</option>
          <option value="2" class="opt-prio2">Moyenne</option>
          <option value="3" class="opt-prio3">Basse (Protéger)</option>
        </select>
      </div>
    </div>
  </div>

  <button id="btn-calc" onclick="solveBuild()">Générer la Feuille de Farm Optimale</button>

  <div id="output" class="results" style="display:none;"></div>
</div>

<script>
  let currentLang = "fr";

  const translations = {
    fr: {
      title: "Calculateur d'Archétypes - Destiny 2",
      section1: "1. Paliers Visés",
      section2: "2. Modificateurs Doctrine",
      section3: "3. Sacrifiabilité (Artifice)",
      btnCalc: "Générer la Feuille de Farm Optimale",
      prio1: "Haute (Sacrifier d'abord)",
      prio2: "Moyenne",
      prio3: "Basse (Protéger)",
      resTitle: "Plan de Farm Suggéré (5 pièces)",
      resAdjustments: "Ajustements (Mods & Artifice)",
      resSummary: "Bilan Final des Stats",
      modBadge: "Mod d'armure",
      artificeBadge: "Bonus Artifice",
      applyMod: "Appliquer un mod",
      activateArtifice: "Activer",
      inExchangeFor: "en échange de",
      slots: ["Casque", "Bras", "Torse", "Jambes", "Objet de classe"],
      stats: { Sante: "Santé", Grenade: "Grenade", Melee: "Mêlée", Super: "Super", Classe: "Classe", Armes: "Armes" },
      tableHeaders: ["Statistique", "Équipement", "Doctrine", "Total Effectif (In-Game)", "Objectif"],
      baseStats: "Stats de base :",
      tertStat: "Stat Tertiaire à viser :",
      floorMsg: "(Plancher 0)",
      archetypes: {
        "Brise-siège": "Brise-siège", "Rempart": "Rempart", "Pugnace": "Pugnace",
        "Escarmoucheur": "Escarmoucheur", "Grenadier": "Grenadier", "Démolisseur": "Démolisseur",
        "Colosse": "Colosse", "Parangon": "Parangon", "Pilleur": "Pilleur",
        "Spécialiste": "Spécialiste", "Mitrailleur": "Mitrailleur", "Maître": "Maître"
      }
    },
    en: {
      title: "Archetype Calculator - Destiny 2",
      section1: "1. Target Tiers",
      section2: "2. Subclass Modifiers",
      section3: "3. Sacrifice Priority (Artifice)",
      btnCalc: "Generate Optimal Farming Sheet",
      prio1: "High (Sacrifice First)",
      prio2: "Medium",
      prio3: "Low (Protect)",
      resTitle: "Suggested Farming Plan (5 Pieces)",
      resAdjustments: "Adjustments (Mods & Artifice)",
      resSummary: "Final Stat Breakdown",
      modBadge: "Armor Mod",
      artificeBadge: "Artifice Bonus",
      applyMod: "Apply mod",
      activateArtifice: "Activate",
      inExchangeFor: "in exchange for",
      slots: ["Helmet", "Gauntlets", "Chest Armor", "Leg Armor", "Class Item"],
      stats: { Sante: "Health", Grenade: "Grenade", Melee: "Melee", Super: "Super", Classe: "Class", Armes: "Weapons" },
      tableHeaders: ["Stat", "Gear", "Subclass", "Effective Total (In-Game)", "Target"],
      baseStats: "Base Stats:",
      tertStat: "Tertiary Stat to Target:",
      floorMsg: "(Floor 0)",
      archetypes: {
        "Brise-siège": "Siegebreaker", "Rempart": "Bulwark", "Pugnace": "Brawler",
        "Escarmoucheur": "Skirmisher", "Grenadier": "Grenadier", "Démolisseur": "Demolitionist",
        "Colosse": "Colossus", "Parangon": "Paragon", "Pilleur": "Looter",
        "Spécialiste": "Specialist", "Mitrailleur": "Gunner", "Maître": "Master"
      }
    }
  };

  const archetypes = [
    { key: "Brise-siège", main: "Sante", sec: "Grenade" },
    { key: "Rempart", main: "Sante", sec: "Classe" },
    { key: "Pugnace", main: "Melee", sec: "Sante" },
    { key: "Escarmoucheur", main: "Melee", sec: "Armes" },
    { key: "Grenadier", main: "Grenade", sec: "Super" },
    { key: "Démolisseur", main: "Grenade", sec: "Classe" },
    { key: "Colosse", main: "Super", sec: "Sante" },
    { key: "Parangon", main: "Super", sec: "Melee" },
    { key: "Pilleur", main: "Classe", sec: "Melee" },
    { key: "Spécialiste", main: "Classe", sec: "Armes" },
    { key: "Mitrailleur", main: "Armes", sec: "Grenade" },
    { key: "Maître", main: "Armes", sec: "Super" }
  ];

  const STATS = ["Sante", "Grenade", "Melee", "Super", "Classe", "Armes"];

  function toggleLanguage() {
    currentLang = document.getElementById("langSelect").value;
    const t = translations[currentLang];

    document.getElementById("ui-title").innerText = t.title;
    document.getElementById("ui-section1").innerText = t.section1;
    document.getElementById("ui-section2").innerText = t.section2;
    document.getElementById("ui-section3").innerText = t.section3;
    document.getElementById("btn-calc").innerText = t.btnCalc;

    STATS.forEach(s => {
      document.getElementById(`lbl-target-${s}`).innerText = t.stats[s] + " :";
      document.getElementById(`lbl-doc-${s}`).innerText = t.stats[s] + " :";
      document.getElementById(`lbl-prio-${s}`).innerText = t.stats[s] + " :";
    });

    document.querySelectorAll(".opt-prio1").forEach(el => el.innerText = t.prio1);
    document.querySelectorAll(".opt-prio2").forEach(el => el.innerText = t.prio2);
    document.querySelectorAll(".opt-prio3").forEach(el => el.innerText = t.prio3);

    if (document.getElementById("output").style.display !== "none") {
      solveBuild();
    }
  }

  function solveBuild() {
    let targets = {}, doctrine = {}, priorities = {}, netNeeded = {};
    
    STATS.forEach(s => {
      targets[s] = parseInt(document.getElementById(`target-${s}`).value) || 0;
      doctrine[s] = parseInt(document.getElementById(`doc-${s}`).value) || 0;
      priorities[s] = parseInt(document.getElementById(`prio-${s}`).value) || 2;
      netNeeded[s] = Math.max(0, targets[s] - doctrine[s]);
    });

    let bestSolution = null;
    let minScore = Infinity;

    function evaluateCombo(selectedArchetypes) {
      let totals = { Sante: 0, Grenade: 0, Melee: 0, Super: 0, Classe: 0, Armes: 0 };
      
      selectedArchetypes.forEach(arch => {
        totals[arch.main] += 30;
        totals[arch.sec] += 25;
      });

      let tertiaryAssignments = [];
      selectedArchetypes.forEach(arch => {
        let validTertiary = STATS.filter(s => s !== arch.main && s !== arch.sec);
        validTertiary.sort((a, b) => (netNeeded[b] - totals[b]) - (netNeeded[a] - totals[a]));
        let chosen = validTertiary[0];
        totals[chosen] += 20;
        tertiaryAssignments.push(chosen);
      });

      let modsUsed = [], artificeUsed = [];
      
      STATS.forEach(s => {
        let diff = netNeeded[s] - totals[s];
        while (diff > 0) {
          if (diff >= 10 && modsUsed.length < 5) {
            totals[s] += 10;
            modsUsed.push({ stat: s, val: 10 });
            diff -= 10;
          } else if (diff >= 5 && artificeUsed.length < 5) {
            let sacrificableStats = [...STATS].filter(st => st !== s);
            sacrificableStats.sort((a, b) => priorities[a] - priorities[b]);
            
            let victim = sacrificableStats[0];
            totals[s] += 5;
            totals[victim] -= 5;
            artificeUsed.push({ boost: s, penalty: victim });
            diff -= 5;
          } else if (modsUsed.length < 5) {
            totals[s] += 5;
            modsUsed.push({ stat: s, val: 5 });
            diff -= 5;
          } else {
            break;
          }
        }
      });

      let deficit = 0, waste = 0;
      STATS.forEach(s => {
        let finalValWithDoc = Math.max(0, totals[s] + doctrine[s]);
        let gap = targets[s] - finalValWithDoc;
        if (gap > 0) deficit += gap * 10;
        else waste += Math.abs(gap);
      });

      let score = deficit + waste;
      if (score < minScore) {
        minScore = score;
        bestSolution = {
          archetypes: selectedArchetypes,
          tertiaries: tertiaryAssignments,
          mods: modsUsed,
          artifices: artificeUsed,
          totals: totals
        };
      }
    }

    function findBest() {
      let sortedStats = [...STATS].sort((a, b) => netNeeded[b] - netNeeded[a]);
      let primaryTarget = sortedStats[0];
      let secondaryTarget = sortedStats[1];

      let candidates = archetypes.filter(a => 
        a.main === primaryTarget || a.sec === primaryTarget ||
        a.main === secondaryTarget || a.sec === secondaryTarget
      );
      if (candidates.length < 3) candidates = archetypes;

      for (let a of candidates) {
        for (let b of candidates) {
          for (let c of candidates) {
            for (let d of candidates) {
              for (let e of candidates) {
                evaluateCombo([a, b, c, d, e]);
              }
            }
          }
        }
      }
    }

    findBest();
    displayResults(bestSolution, targets, doctrine);
  }

  function displayResults(sol, targets, doctrine) {
    if (!sol) return;

    const t = translations[currentLang];
    let html = `<h3>${t.resTitle}</h3>`;
    
    t.slots.forEach((slot, idx) => {
      let arch = sol.archetypes[idx];
      let tert = sol.tertiaries[idx];
      let archName = t.archetypes[arch.key];
      
      html += `
        <div class="piece-card">
          <div class="piece-title">${slot} : <span style="color:#58a6ff">${archName}</span></div>
          <div style="font-size:0.9em; margin-top:4px;">
            • ${t.baseStats} <b>${t.stats[arch.main]} (+30)</b> | <b>${t.stats[arch.sec]} (+25)</b><br>
            • ${t.tertStat} <b style="color:#e3b341">${t.stats[tert]} (+20)</b>
          </div>
        </div>
      `;
    });

    html += `<h3>${t.resAdjustments}</h3><ul>`;
    sol.mods.forEach(m => {
      html += `<li><span class="badge badge-mod">${t.modBadge}</span> ${t.applyMod} <b>+${m.val} ${t.stats[m.stat]}</b></li>`;
    });
    sol.artifices.forEach(a => {
      html += `<li><span class="badge badge-artifice">${t.artificeBadge}</span> ${t.activateArtifice} <b>+5 ${t.stats[a.boost]}</b> ${t.inExchangeFor} <b style="color:#f85149">-5 ${t.stats[a.penalty]}</b></li>`;
    });
    html += `</ul>`;

    html += `<h3>${t.resSummary}</h3>`;
    html += `<table class="summary-table">
      <tr><th>${t.tableHeaders[0]}</th><th>${t.tableHeaders[1]}</th><th>${t.tableHeaders[2]}</th><th>${t.tableHeaders[3]}</th><th>${t.tableHeaders[4]}</th></tr>`;
    
    STATS.forEach(s => {
      let equipTotal = sol.totals[s];
      let docVal = doctrine[s];
      
      let finalTotal = Math.max(0, equipTotal + docVal);
      let targetVal = targets[s];
      let statusColor = finalTotal >= targetVal ? "#3fb950" : "#f85149";

      html += `<tr>
        <td><b>${t.stats[s]}</b></td>
        <td>${equipTotal}</td>
        <td>${docVal >= 0 ? '+' + docVal : docVal}</td>
        <td style="color:${statusColor}; font-weight:bold;">${finalTotal} ${equipTotal + docVal < 0 ? t.floorMsg : ''}</td>
        <td>${targetVal}</td>
      </tr>`;
    });
    html += `</table>`;

    const outDiv = document.getElementById("output");
    outDiv.innerHTML = html;
    outDiv.style.display = "block";
  }
</script>

</body>
</html>
